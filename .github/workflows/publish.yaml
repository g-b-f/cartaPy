name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - dev
      - develop

jobs:
  publish:
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: g-b-f/workflows/.github/workflows/maturin_publish.yaml@master
    with:
      package-name: cartapy
      smoke-test-script: |
        from carta import convert, _get_binary_version

        print(_get_binary_version(), flush=True)

        html = "<p><em>Hello</em> world!</p>"
        markdown = "*Hello* world!"

        expected_md = convert(html).from_html.to_markdown()
        expected_html = convert(markdown).from_markdown.to_html()

        assert expected_md == markdown, f"Expected: {markdown}, but got: {expected_md}"
        assert expected_html == html, f"Expected: {html}, but got: {expected_html}"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

