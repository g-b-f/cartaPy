name: Reusable Maturin Publish

on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
        description: 'Name of the package to install for the smoke test'
      smoke-test-script:
        required: true
        type: string
        description: 'Multi-line Python smoke test to run after installing the wheel'
      python-version:
        required: false
        type: string
        default: '3.11'
        description: 'Python version for the test and test-install jobs'
      tests-directory:
        required: false
        type: string
        default: 'tests'
        description: 'Directory containing pytest tests'
      test-install-artifact-pattern:
        required: false
        type: string
        default: 'wheels-linux-*'
        description: 'Artifact pattern to download for the test-install job'

    secrets:
      PYPI_API_TOKEN:
        required: true
        description: 'PyPI API token passed as UV_PUBLISH_TOKEN'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify Cargo.toml version matches tag
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python -c "
          from os import environ as env
          import sys
          import tomllib

          if not env['GITHUB_REF'].startswith('refs/tags/v'):
              print('Not a version tag push, skipping check')
              sys.exit(0)

          tag_version = env['GITHUB_REF_NAME'].removeprefix('v')

          with open('Cargo.toml', 'rb') as f:
              data = tomllib.load(f)
              cargo_version = data['package']['version']

          assert cargo_version == tag_version, f'{cargo_version=} {tag_version=}'
          print(f'Cargo.toml version ({cargo_version}) matches tag ({tag_version})')
          "

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04-arm
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64-unknown-linux-gnu: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64-unknown-linux-musl: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64_unknown_linux_musl: "-march=armv8-a -D__ARM_ARCH=8"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run python -m pytest ${{ inputs.tests-directory }}/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04-arm
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64-unknown-linux-gnu: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64-unknown-linux-musl: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64_unknown_linux_musl: "-march=armv8-a -D__ARM_ARCH=8"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  android:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        platform:
          - aarch64-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64-linux-android: "-march=armv8-a -D__ARM_ARCH=8"
          CFLAGS_aarch64_linux_android: "-march=armv8-a -D__ARM_ARCH=8"
        with:
          target: ${{ matrix.platform }}
          args: --release --out dist -i python3.12
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-android-${{ matrix.platform }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  test_install:
    name: Test Install
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.test-install-artifact-pattern }}
          path: dist/
          merge-multiple: true

      - name: Install local wheel
        run: pip install --no-index --find-links=dist/ ${{ inputs.package-name }}

      - name: Import and smoke test
        env:
          SMOKE_TEST: ${{ inputs.smoke-test-script }}
        run: python -c "import os; exec(os.environ['SMOKE_TEST'])"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, android, sdist, test_install]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
