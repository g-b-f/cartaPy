[package]
name = "cartapy"
version = "2.1.0"
edition = "2024"
description = "Easy to use document converter"
license = "MIT"
repository = "https://github.com/g-b-f/cartapy"

[lib]
name = "_rust_wrapper"
crate-type = ["cdylib"]

[features]
default = ["abi3-py39"]
abi3-py39 = ["pyo3/abi3-py39"]
abi3-py314 = ["pyo3/abi3-py314"]
abi3t-py315 = ["pyo3/abi3t-py315"]

[dependencies]
carta = { version = "0.0.11", features = ["read-csv", "read-tsv"] }
pyo3 = { version = "0.29.3", features = ["extension-module"] }